[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-traefik"
version = "0.2.0"
description = "A Traefik-like reverse proxy implemented in Python (asyncio + Starlette)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Kubenew"}]
dependencies = [
  "starlette>=0.37.2",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
  "prometheus-client>=0.20.0",
  "typer>=0.12.3",
  "cryptography>=41.0.0",
]

[project.scripts]
python-traefik = "python_traefik.cli:app"
