[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-traefik"
version = "0.4.0"
description = "A Traefik-like reverse proxy implemented in Python (asyncio + Starlette)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name="Kubenew"}]
dependencies = [
  "starlette>=0.37.2",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
  "prometheus-client>=0.20.0",
  "typer>=0.12.3",
  "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4.0",
  "mypy>=1.10",
]

[project.scripts]
python-traefik = "python_traefik.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
