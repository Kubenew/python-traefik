entryPoints:
  web:
    address: ":8000"
  websecure:
    address: ":8443"

routers:
  app_router:
    rule: "Host(`example.com`) && PathPrefix(`/`)"
    service: "app_service"
    middlewares:
      - "rate-limiter"
    priority: 10
    entryPoints:
      - "web"

  api_router:
    rule: "Host(`example.com`) && PathPrefix(`/api`)"
    service: "api_service"
    middlewares:
      - "rate-limiter"
      - "retry"
    priority: 20
    entryPoints:
      - "web"

services:
  app_service:
    loadBalancer:
      servers:
        - url: "http://localhost:5000"
        - url: "http://localhost:5001"

  api_service:
    loadBalancer:
      servers:
        - url: "http://localhost:6000"
        - url: "http://localhost:6001"

middlewares:
  rate-limiter:
    type: "rate-limit"
    maxRequests: 100
    windowSeconds: 1

  retry:
    type: "retry"
    attempts: 3

metrics:
  enabled: true
  path: "/metrics"

healthcheck:
  enabled: true
  interval_seconds: 5
  timeout_seconds: 2
  path: "/health"

dashboard:
  enabled: true
  address: ":8080"

logging:
  level: "INFO"
  accessLog: true
