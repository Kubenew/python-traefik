entryPoints:
  web:
    address: ":8000"

routers:
  app_router:
    rule: "Host(`example.com`) && PathPrefix(`/`)"
    service: "app_service"

services:
  app_service:
    loadBalancer:
      servers:
        - url: "http://localhost:5000"
        - url: "http://localhost:5001"

metrics:
  enabled: true
  path: "/metrics"

healthcheck:
  enabled: true
  interval_seconds: 5
  timeout_seconds: 2
  path: "/health"
